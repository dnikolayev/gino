name: Python environment
description: Restore the locked development environment in a Python job container.
inputs:
  poetry-version:
    description: Poetry version used to install the locked dependencies.
    default: '1.1.13'
  pip-version:
    description: pip version used in the application environment.
    default: '21.3.1'
  setuptools-version:
    description: setuptools version used in the application environment.
    default: '59.6.0'
runs:
  using: composite
  steps:
    - name: Identify Python environment
      id: identity
      shell: bash
      run: |
        identity=$(python -c 'import platform; print(platform.python_version() + "-" + platform.machine())')
        distribution=$(sha256sum /etc/os-release | cut -d ' ' -f 1)
        echo "value=$identity-$distribution" >> "$GITHUB_OUTPUT"

    - name: Restore virtualenv
      id: cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.identity.outputs.value }}-poetry${{ inputs.poetry-version }}-pip${{ inputs.pip-version }}-setuptools${{ inputs.setuptools-version }}-${{ hashFiles('poetry.lock', 'pyproject.toml', '.github/actions/python-environment/action.yml') }}

    - name: Activate virtualenv
      shell: bash
      run: |
        if [ ! -x .venv/bin/python ]; then
          python -m venv .venv
        fi
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"

    - name: Install locked dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        POETRY_VERSION: ${{ inputs.poetry-version }}
        PIP_VERSION: ${{ inputs.pip-version }}
        SETUPTOOLS_VERSION: ${{ inputs.setuptools-version }}
        POETRY_HOME: ${{ runner.temp }}/poetry
      run: |
        python -m pip install "pip==$PIP_VERSION" "setuptools==$SETUPTOOLS_VERSION"
        curl -fsSL https://install.python-poetry.org | python - --yes --version "$POETRY_VERSION"
        "$POETRY_HOME/venv/bin/python" -m pip install "setuptools==$SETUPTOOLS_VERSION"
        "$POETRY_HOME/bin/poetry" install --no-interaction -E pg -E mysql
